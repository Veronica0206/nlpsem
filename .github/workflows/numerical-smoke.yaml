name: Portable numerical smoke and linear recovery

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical:
    name: Numerical smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload
          needs: check
      - name: Run predeclared independent synthetic checks
        shell: Rscript {0}
        run: |
          status <- system2(file.path(R.home("bin"), "Rscript"),
                            c("data-raw/run_portable_qualification.R", "test-results/portable", "50", "20261025", "."))
          if (status != 0) stop("Portable qualification failed; inspect retained results.")
      - name: Retain numerical evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portable-numerical-${{ matrix.os }}
          path: test-results/portable/
          if-no-files-found: error
          retention-days: 30
