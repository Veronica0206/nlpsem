name: Documentation build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown
          needs: website
      # Reference examples remain visible; package checks execute examples.
      # Articles are rendered, including the short fitted-object workflow.
      - name: Build documentation locally on the runner
        shell: Rscript {0}
        run: pkgdown::build_site(preview = FALSE, examples = FALSE, new_process = TRUE)
      - name: Retain documentation for review
        uses: actions/upload-artifact@v7
        with:
          name: nlpsem-documentation
          path: docs/
          if-no-files-found: error
          retention-days: 30
