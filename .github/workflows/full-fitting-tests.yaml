name: Full fitting tests (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fitting:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NOT_CRAN: "true"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload
          needs: check
      - name: Run all tests, including fitting references
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          Rscript -e 'sessionInfo(); testthat::test_local(".", reporter = "summary", stop_on_failure = TRUE)' 2>&1 | tee test-results/full-fitting.log
      - name: Retain fitting evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-fitting-tests
          path: test-results/
          if-no-files-found: warn
          retention-days: 30
